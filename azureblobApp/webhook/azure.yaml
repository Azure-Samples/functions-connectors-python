name: functions-connectors-python-azureblob-webhook
metadata:
  template: functions-connectors-python-azureblob-webhook@0.0.1-alpha
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/postdeploy.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./infra/scripts/postdeploy.sh
      interactive: true
      continueOnError: false
services:
  function-app:
    project: .
    language: python
    host: function