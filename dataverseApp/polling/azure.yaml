name: azure-functions-dataverse-polling-python
metadata:
  template: azure-functions-dataverse-polling-python@0.0.1-alpha
requiredVersions:
  azd: ">= 1.33.0"
services:
  function-app:
    project: .
    language: python
    host: function
infra:
  layers:
    - name: base
      path: infra
      module: main
    - name: triggers
      path: infra
      module: triggers
      dependsOn:
        - base
      hooks:
        preprovision:
          windows:
            shell: pwsh
            run: ./scripts/configure-triggers.ps1 prepare
            interactive: true
          posix:
            shell: sh
            run: sh ./scripts/configure-triggers.sh prepare
            interactive: true
          continueOnError: false
    - name: app
      path: infra
      module: app
      dependsOn:
        - triggers
      hooks:
        preprovision:
          windows:
            shell: pwsh
            run: ./scripts/configure-triggers.ps1 verify
            interactive: true
          posix:
            shell: sh
            run: sh ./scripts/configure-triggers.sh verify
            interactive: true
          continueOnError: false
workflows:
  up:
    - azd: package --all
    - azd: provision base
    - azd: provision triggers
    - azd: provision app
    - azd: deploy --all
hooks:
  preprovision:
    shell: pwsh
    run: ./infra/scripts/validate-events.ps1
    continueOnError: false
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/configure-triggers.ps1 finish
    posix:
      shell: sh
      run: sh ./infra/scripts/configure-triggers.sh finish
    continueOnError: false
