# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: functions-connectors-python-onedrive-polling
services:
  function-app:
    host: function
    project: .
    language: python
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: |
        $python = if ($env:PYTHON) { $env:PYTHON } else { 'python' }
        & $python ./infra/scripts/validate-folder.py
        if ($LASTEXITCODE -ne 0) { throw 'OneDrive folder ID validation failed.' }
    posix:
      shell: sh
      run: '"${PYTHON:-python}" ./infra/scripts/validate-folder.py'
    continueOnError: false
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/postdeploy.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: bash ./infra/scripts/postdeploy.sh
      interactive: true
      continueOnError: false