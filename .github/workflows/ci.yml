name: Sample CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python checks and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install public validation tools
        run: python -m pip install --index-url https://pypi.org/simple -r .github/requirements-ci.txt
      - name: Compile Python sources
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Focused Python correctness checks
        run: python -m ruff check --select E9,F63,F7,F82 .
      - name: Audit sample dependencies
        run: |
          mapfile -d '' requirement_files < <(git ls-files -z -- '*requirements.txt' ':!:.github/requirements-ci.txt')
          if [ "${#requirement_files[@]}" -eq 0 ]; then
            echo "No requirements.txt files found." >&2
            exit 1
          fi
          for file in "${requirement_files[@]}"; do
            echo "::group::pip-audit $file"
            python -m pip_audit --progress-spinner off --index-url https://pypi.org/simple -r "$file"
            echo "::endgroup::"
          done

