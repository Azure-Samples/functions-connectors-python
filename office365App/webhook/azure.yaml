name: azure-functions-m365-email-python-webhook
metadata:
  template: azure-functions-m365-email-python-webhook@0.0.1-alpha
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/postdeploy.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: sh ./infra/scripts/postdeploy.sh
      interactive: true
      continueOnError: false
services:
  function-app:
    project: .
    language: python
    host: function
