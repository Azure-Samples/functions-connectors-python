# yaml-language-server: $schema=https://aka.ms/azure-dev/azure.yaml.json
name: azure-functions-vsts-python-polling
metadata:
  template: azure-functions-vsts-python-polling@0.0.1-alpha
requiredVersions:
  azd: ">= 1.33.0"
infra:
  layers:
    - name: foundation
      path: infra
      module: main
    - name: triggers
      path: infra
      module: triggers
      dependsOn: [foundation]
      hooks:
        preprovision:
          windows:
            shell: pwsh
            run: ./scripts/preprovision.ps1
            interactive: true
            continueOnError: false
          posix:
            shell: sh
            run: sh ./scripts/preprovision.sh
            interactive: true
            continueOnError: false
    - name: app
      path: infra
      module: app
      dependsOn: [triggers]
      hooks:
        preprovision:
          windows:
            shell: pwsh
            run: ./scripts/prepare-app.ps1
            continueOnError: false
          posix:
            shell: sh
            run: sh ./scripts/prepare-app.sh
            continueOnError: false
workflows:
  up:
    - azd: package --all
    - azd: provision foundation
    - azd: provision triggers
    - azd: provision app
    - azd: deploy --all
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/postdeploy.ps1
      continueOnError: false
    posix:
      shell: sh
      run: ./infra/scripts/postdeploy.sh
      continueOnError: false
services:
  function-app:
    project: .
    language: python
    host: function